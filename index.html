<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Für dich...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #fff5f5;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        /* Intro-Bildschirm mit Herz */
        #intro {
            position: absolute;
            z-index: 10;
            width: 100%;
            height: 100%;
            background-color: #fff5f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 1s ease-out, visibility 1s;
        }
        .heart {
            background-color: #ff4b6e;
            display: inline-block;
            height: 70px;
            position: relative;
            transform: rotate(-45deg);
            width: 70px;
            animation: pulse 1.2s infinite;
            box-shadow: 0 10px 30px rgba(255, 75, 110, 0.3);
        }
        .heart:before, .heart:after {
            content: "";
            background-color: #ff4b6e;
            border-radius: 50%;
            height: 70px;
            position: absolute;
            width: 70px;
        }
        .heart:before { top: -35px; left: 0; }
        .heart:after { left: 35px; top: 0; }
        
        #intro p {
            margin-top: 60px;
            color: #ff4b6e;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            animation: fadeText 1.5s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: rotate(-45deg) scale(1); }
            50% { transform: rotate(-45deg) scale(1.15); }
            100% { transform: rotate(-45deg) scale(1); }
        }
        @keyframes fadeText {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Hauptinhalt mit dem Bild */
        #content {
            opacity: 0;
            transform: scale(0.9);
            transition: all 1.5s cubic-bezier(0.25, 1, 0.5, 1);
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 2;
        }
        #content.show {
            opacity: 1;
            transform: scale(1);
        }
        .img-container {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            overflow: hidden;
            border: 8px solid white;
            background: white;
        }
        .img-container img {
            display: block;
            width: 100%;
            max-height: 85vh;
            object-fit: contain;
            transition: opacity 0.4s ease-in-out;
        }

        /* Schwebende Herzen-Effekt */
        .falling-heart {
            position: absolute;
            bottom: -20px;
            color: #ff4b6e;
            font-size: 20px;
            opacity: 0.7;
            pointer-events: none;
            z-index: 1;
            animation: floatUp 4s linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(-105vh) translateX(var(--randomX)) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Startseite: Zum Öffnen tippen -->
    <div id="intro" onclick="revealSecret()">
        <div class="heart"></div>
        <p>Tippe auf das Herz...</p>
    </div>

    <!-- Das eigentliche Bild (Slideshow & danach das Frage-Bild) -->
    <div id="content">
        <div class="img-container">
            <img id="myImage" src="IMG_0109.jpeg" alt="Für dich">
        </div>
    </div>

    <script>
        // Basissortierung der 10 Bilder ohne fixe Endung
        const baseNames = [
            "IMG_0109",
            "IMG_0067",
            "IMG_0073",
            "IMG_7026",
            "IMG_0017",
            "IMG_0057",
            "IMG_0208",
            "IMG_7025",
            "IMG_7030",
            "IMG_7031"
        ];

        const finalImage = "415B1616-B5CE-4FCA-A18B-B9795F993C11.jpeg";
        let currentIndex = 0;

        // Versuche verschiedene Bild-Endungen (.jpeg, .JPG, .png, .jpg), falls GitHub zickt
        function setImageWithFallback(imgElement, baseName) {
            const extensions = ['.jpeg', '.JPG', '.png', '.jpg', '.JPEG', '.PNG'];
            let extIndex = 0;

            function tryNext() {
                if (extIndex < extensions.length) {
                    imgElement.src = baseName + extensions[extIndex];
                    extIndex++;
                }
            }

            imgElement.onerror = tryNext;
            tryNext();
        }

        function revealSecret() {
            const intro = document.getElementById('intro');
            intro.style.opacity = '0';
            setTimeout(() => { intro.style.display = 'none'; }, 1000);

            setTimeout(() => {
                document.getElementById('content').classList.add('show');
                setInterval(createHeart, 300);

                const img = document.getElementById('myImage');
                setImageWithFallback(img, baseNames[0]);

                const slideInterval = setInterval(() => {
                    currentIndex++;
                    img.style.opacity = '0';

                    setTimeout(() => {
                        if (currentIndex < baseNames.length) {
                            setImageWithFallback(img, baseNames[currentIndex]);
                        } else {
                            // Slideshow zu Ende -> Frage-Bild aus deinem ursprünglichen Code anzeigen
                            img.onerror = null;
                            img.src = finalImage;
                            clearInterval(slideInterval);
                        }
                        img.style.opacity = '1';
                    }, 400);

                }, 3000);
            }, 400);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('falling-heart');
            const icons = ['❤️', '💖', '💝', '💕'];
            heart.innerText = icons[Math.floor(Math.random() * icons.length)];
            
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            heart.style.setProperty('--randomX', (Math.random() * 100 - 50) + 'px');
            heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
            
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }
    </script>
</body>
</html>
