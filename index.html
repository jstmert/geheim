<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Für dich...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #fff5f5;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Intro-Bildschirm */
        #intro {
            position: absolute;
            z-index: 10;
            width: 100%;
            height: 100%;
            background-color: #fff5f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 1s ease-out, visibility 1s;
        }
        .heart {
            background-color: #ff4b6e;
            display: inline-block;
            height: 70px;
            position: relative;
            transform: rotate(-45deg);
            width: 70px;
            animation: pulse 1.2s infinite;
            box-shadow: 0 10px 30px rgba(255, 75, 110, 0.3);
        }
        .heart:before, .heart:after {
            content: "";
            background-color: #ff4b6e;
            border-radius: 50%;
            height: 70px;
            position: absolute;
            width: 70px;
        }
        .heart:before { top: -35px; left: 0; }
        .heart:after { left: 35px; top: 0; }
        
        #intro p {
            margin-top: 60px;
            color: #ff4b6e;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            animation: fadeText 1.5s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: rotate(-45deg) scale(1); }
            50% { transform: rotate(-45deg) scale(1.15); }
            100% { transform: rotate(-45deg) scale(1); }
        }
        @keyframes fadeText {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Hauptinhalt mit Slideshow */
        #content {
            opacity: 0;
            transform: scale(0.9);
            transition: all 1.5s cubic-bezier(0.25, 1, 0.5, 1);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 2;
        }
        #content.show {
            opacity: 1;
            transform: scale(1);
        }

        .img-container {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            overflow: hidden;
            border: 8px solid white;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .img-container img {
            display: block;
            width: 100%;
            max-height: 70vh;
            object-fit: contain;
            transition: opacity 0.8s ease-in-out;
        }

        /* Titel/Frage unter den Bildern */
        .question {
            margin-top: 20px;
            font-size: 1.8rem;
            color: #ff4b6e;
            font-weight: bold;
            text-align: center;
            text-shadow: 1px 1px 10px rgba(255, 75, 110, 0.2);
        }

        /* Schwebende Herzen-Effekt */
        .falling-heart {
            position: absolute;
            bottom: -20px;
            color: #ff4b6e;
            font-size: 20px;
            opacity: 0.7;
            pointer-events: none;
            z-index: 1;
            animation: floatUp 4s linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(-105vh) translateX(var(--randomX)) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Startseite: Zum Öffnen tippen -->
    <div id="intro" onclick="revealSecret()">
        <div class="heart"></div>
        <p>Tippe auf das Herz...</p>
    </div>

    <!-- Slideshow mit euren Bildern -->
    <div id="content">
        <div class="img-container">
            <img id="slideshow" src="bild1.jpg" alt="Unsere Erinnerungen">
        </div>
        <h1 class="question">Willst du meine Freundin sein? ❤️</h1>
    </div>

    <script>
        // Liste eurer Bilder
        const images = [
            "bild1.jpg",
            "bild2.jpg",
            "bild3.jpg",
            "bild4.jpg",
            "bild5.jpg",
            "bild6.jpg",
            "bild7.jpg",
            "bild8.jpg",
            "bild9.jpg",
            "bild10.jpg"
        ];

        let currentIndex = 0;

        function revealSecret() {
            // Intro ausblenden
            const intro = document.getElementById('intro');
            intro.style.opacity = '0';
            setTimeout(() => intro.style.display = 'none', 1000);

            // Hauptseite einblenden & Animationen starten
            setTimeout(() => {
                document.getElementById('content').classList.add('show');
                setInterval(createHeart, 300);
                
                // Alle 3,5 Sekunden das Bild wechseln
                setInterval(changeImage, 3500);
            }, 400);
        }

        function changeImage() {
            const imgElement = document.getElementById('slideshow');
            imgElement.style.opacity = '0'; // Überblend-Effekt
            
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % images.length;
                imgElement.src = images[currentIndex];
                imgElement.style.opacity = '1';
            }, 400);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('falling-heart');
            const icons = ['❤️', '💖', '💝', '💕'];
            heart.innerText = icons[Math.floor(Math.random() * icons.length)];
            
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            heart.style.setProperty('--randomX', (Math.random() * 100 - 50) + 'px');
            heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
            
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }
    </script>
</body>
</html>
