    /* Intro-Bildschirm */
    #intro {
        position: absolute;
        z-index: 10;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        background-color: #fff5f5;
        -webkit-user-select: none;
        user-select: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: opacity 0.4s ease-out, visibility 0.4s;
    }
    .heart {
        display: block;
        width: 100px;
        height: 100px;
        margin: 0 auto;
        fill: #ff4b6e;
        filter: drop-shadow(0 10px 20px rgba(255, 75, 110, 0.35));
        animation: pulse 1.2s infinite;
    }

    #intro p {
        text-align: center;
        margin-top: 40px;
        color: #ff4b6e;
        font-size: 1.2rem;
        font-weight: bold;
        letter-spacing: 1px;
        animation: fadeText 1.5s infinite alternate;
    }
    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.15); }
        100% { transform: scale(1); }
    }
    @keyframes fadeText {
        0% { opacity: 0.5; }
        100% { opacity: 1; }
    }

    /* Hauptinhalt mit dem Bild */
    #content {
        opacity: 0;
        transform: scale(0.9);
        transition: all 0.4s ease-out;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        padding-top: max(20px, env(safe-area-inset-top));
        padding-bottom: max(20px, env(safe-area-inset-bottom));
        z-index: 2;
    }
    #content.show {
        opacity: 1;
        transform: scale(1);
    }
    /* Fester Rahmen: keine Layout-Sprünge beim Bildwechsel */
    .img-container {
        width: min(92vw, 520px);
        height: 80vh;
        height: 78dvh;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        overflow: hidden;
        -webkit-transform: translateZ(0);
        transform: translateZ(0);
        border: 8px solid white;
        background: white;
    }
    .img-container img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    .pop-effect {
        animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popUp {
        0% { transform: scale(0.6); opacity: 0; }
        70% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
    }

    /* Schwebende Herzen */
    .falling-heart {
        position: absolute;
        bottom: -20px;
        color: #ff4b6e;
        font-size: 20px;
        opacity: 0.7;
        pointer-events: none;
        z-index: 1;
        will-change: transform, opacity;
        animation: floatUp 4s linear infinite;
    }
    @keyframes floatUp {
        0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0.8; }
        100% { transform: translate3d(var(--randomX), -110vh, 0) rotate(360deg); opacity: 0; }
    }

<!-- Hauptbild -->
<div id="content">
    <div class="img-container" id="card">
        <img id="myImage" src="IMG_0109.jpeg" alt="">
    </div>
</div>

<script>
    const images = [
        "IMG_0109.jpeg",
        "IMG_0067.jpeg",
        "IMG_0073.jpeg",
        "IMG_7026.jpeg",
        "IMG_0017.jpeg",
        "IMG_0057.jpeg",
        "IMG_0208.jpeg",
        "IMG_7025.jpeg",
        "IMG_7030.jpeg",
        "IMG_7031.png"
    ];
    const finalImage = "415B1616-B5CE-4FCA-A18B-B9795F993C11.jpeg";

    // Alle Bilder sofort laden UND dekodieren (Referenzen behalten,
    // damit der Browser sie nicht wieder aus dem Speicher wirft)
    const loaded = [];
    const preloadPromise = Promise.race([
        Promise.all(
            [...images, finalImage].map(src => {
                const im = new Image();
                im.src = src;
                loaded.push(im);
                // Safari: decode() kann bei großen Bildern hängen oder fehlschlagen
                return (im.decode ? im.decode() : Promise.resolve()).catch(() => {});
            })
        ),
        // Fallback: nach 8 Sekunden trotzdem starten
        new Promise(resolve => setTimeout(resolve, 8000))
    ]);

    let started = false;

    async function revealSecret() {
        if (started) return;
        started = true;

        const intro = document.getElementById('intro');
        intro.style.opacity = '0';
        setTimeout(() => { intro.style.display = 'none'; }, 400);

        // Wartet, bis wirklich alle Bilder bereit sind
        await preloadPromise;

        const img = document.getElementById('myImage');
        const card = document.getElementById('card');

        img.src = images[0];
        document.getElementById('content').classList.add('show');
        setInterval(createHeart, 400);

        let currentIndex = 0;
        const slideInterval = setInterval(() => {
            currentIndex++;
            if (currentIndex < images.length) {
                img.src = images[currentIndex];
            } else {
                clearInterval(slideInterval);
                img.src = finalImage;
                card.classList.add('pop-effect');
            }
        }, 250);
    }

    function createHeart() {
        const heart = document.createElement('div');
        heart.classList.add('falling-heart');
        const icons = ['❤️', '💖', '💝', '💕'];
        heart.innerText = icons[Math.floor(Math.random() * icons.length)];

        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
        heart.style.setProperty('--randomX', (Math.random() * 100 - 50) + 'px');
        heart.style.fontSize = (Math.random() * 15 + 15) + 'px';

        document.body.appendChild(heart);
        setTimeout(() => { heart.remove(); }, 6000);
    }
</script>
